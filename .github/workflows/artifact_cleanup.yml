name: Clean merged PR artifacts

on:
  pull_request:
    types: [closed]
    branches: [operations, "sync/v*"]
  push:
    branches: [operations]
  workflow_run:
    workflows: ["DSW Document Template Translation Sync"]
    types: [completed]
  schedule:
    - cron: "47 2,14 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: Delete eligible artifacts; leave off to preview the plan.
        type: boolean
        default: false

permissions:
  contents: read
  actions: write
  pull-requests: read

jobs:
  cleanup:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository)
    uses: ThreeMonth03/dsw-km-translation-tool/.github/workflows/cleanup_pr_artifacts.yml@6a6fe5c807d5d5f3f2484ce505e7b961b2f64526
    with:
      tooling_ref: 6a6fe5c807d5d5f3f2484ce505e7b961b2f64526
      apply: ${{ github.event_name != 'workflow_dispatch' || inputs.apply }}
      artifact_patterns: |
        document-template-package-*
        document-template-preview-*
