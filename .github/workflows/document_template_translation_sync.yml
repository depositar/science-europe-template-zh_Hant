name: DSW Translation Control Plane

on:
  pull_request:
    branches: ["master"]
  workflow_dispatch:
    inputs:
      source_version:
        description: "Source version to migrate from, e.g. v1.30.1. Defaults to latest supported version."
        required: false
        type: string
  workflow_run:
    workflows: ["DSW Document Template Translation Sync"]
    types: [completed]
  schedule:
    # 04:00 Asia/Taipei every day.
    - cron: "0 20 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: >-
    dsw-translation-control-plane-${{ github.event_name == 'workflow_run' &&
    github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

jobs:
  validate-control-plane:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout translation control repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout DSW document-template tooling
        uses: actions/checkout@v4
        with:
          repository: ThreeMonth03/DSW-document-template-tool
          ref: master
          path: tooling-repo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tooling dependencies
        working-directory: tooling-repo
        run: make install-dev BOOTSTRAP_PYTHON=python

      - name: Validate translation configuration
        env:
          CONFIG_PATH: translation-config.yml
        run: |
          set -euo pipefail
          tooling_python="$GITHUB_WORKSPACE/tooling-repo/.venv/bin/python"

          "$tooling_python" - <<'PY'
          from __future__ import annotations

          import os
          import subprocess
          from pathlib import Path

          import yaml

          config_path = Path(os.environ["CONFIG_PATH"])
          config = yaml.safe_load(config_path.read_text(encoding="utf-8"))

          required_top_level = {
              "schema_version",
              "template",
              "translation",
              "branches",
              "tooling",
              "migration",
          }
          missing = sorted(required_top_level - set(config))
          if missing:
              raise SystemExit(f"Missing top-level config keys: {', '.join(missing)}")

          template = config["template"]
          branches = config["branches"]
          migration = config["migration"]

          upstream = template["upstream_repository"]
          supported_versions = template["supported_versions"]
          if not supported_versions:
              raise SystemExit("template.supported_versions must not be empty")
          if migration["mode"] != "exact-only":
              raise SystemExit("Only exact-only migration is currently allowed")

          def remote_ref_exists(*args: str) -> bool:
              result = subprocess.run(
                  ["git", "ls-remote", "--exit-code", *args],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  check=False,
              )
              return result.returncode == 0

          missing_tags: list[str] = []
          missing_branches: list[str] = []
          branch_prefix = branches["version_branch_prefix"]

          for version in supported_versions:
              if not remote_ref_exists("--tags", upstream, f"refs/tags/{version}"):
                  missing_tags.append(version)
              branch_name = f"{branch_prefix}{version}"
              if not remote_ref_exists("--heads", "origin", branch_name):
                  missing_branches.append(branch_name)

          if missing_tags or missing_branches:
              details: list[str] = []
              if missing_tags:
                  details.append("Missing upstream tags: " + ", ".join(missing_tags))
              if missing_branches:
                  details.append("Missing translation branches: " + ", ".join(missing_branches))
              raise SystemExit("\n".join(details))

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          summary.write_text(
              "\n".join(
                  [
                      "## Translation control plane",
                      "",
                      f"- Upstream repository: `{upstream}`",
                      f"- Supported versions: `{', '.join(supported_versions)}`",
                      f"- Version branch prefix: `{branch_prefix}`",
                      f"- Migration mode: `{migration['mode']}`",
                      "",
                      "All configured upstream tags and translation branches exist.",
                      "",
                  ]
              ),
              encoding="utf-8",
          )
          PY

  migrate-translations:
    needs: validate-control-plane
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'translation/v'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout translation control repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout DSW document-template tooling
        uses: actions/checkout@v4
        with:
          repository: ThreeMonth03/DSW-document-template-tool
          ref: master
          path: tooling-repo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tooling dependencies
        working-directory: tooling-repo
        run: make install-dev BOOTSTRAP_PYTHON=python

      - name: Resolve migration source version
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_SOURCE_VERSION: ${{ inputs.source_version }}
          WORKFLOW_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          source_version="$MANUAL_SOURCE_VERSION"

          if [ -z "$source_version" ] && [ "$EVENT_NAME" = "workflow_run" ]; then
            case "$WORKFLOW_RUN_HEAD_BRANCH" in
              translation/v*) source_version="${WORKFLOW_RUN_HEAD_BRANCH#translation/}" ;;
              *)
                echo "No translation version source branch found; skipping."
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          fi

          if [ -z "$source_version" ]; then
            source_version="$(
              python -c 'import yaml; config = yaml.safe_load(open("translation-config.yml", encoding="utf-8")); print(config["template"]["supported_versions"][-1])'
            )"
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "source_version=$source_version" >> "$GITHUB_OUTPUT"
          echo "Using migration source version: $source_version"

      - name: Create or update migration PRs
        if: steps.source.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tooling_python="$GITHUB_WORKSPACE/tooling-repo/.venv/bin/python"
          "$tooling_python" "$GITHUB_WORKSPACE/tooling-repo/scripts/ci/create_translation_migration_prs.py" \
            --repo "$GITHUB_WORKSPACE" \
            --tooling-root "$GITHUB_WORKSPACE/tooling-repo" \
            --source-version "${{ steps.source.outputs.source_version }}" \
            --push \
            --create-pr
