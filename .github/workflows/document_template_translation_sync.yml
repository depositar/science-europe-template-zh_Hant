name: DSW Document Template Translation Operations

on:
  pull_request:
    branches: ["master"]
  workflow_dispatch:
    inputs:
      source_version:
        description: "Source version to migrate from, e.g. v1.30.1. Defaults to latest supported version."
        required: false
        type: string
  workflow_run:
    workflows: ["DSW Document Template Translation Sync"]
    types: [completed]
  schedule:
    # 04:00 Asia/Taipei every day.
    - cron: "0 20 * * *"

permissions:
  contents: write
  pull-requests: write
  actions: read

env:
  TOOLING_WORKFLOW: headless_render_regression.yml

concurrency:
  group: >-
    dsw-translation-operations-${{ github.event_name == 'workflow_run' &&
    github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

jobs:
  validate-translation-repo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout translation repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.TRANSLATION_AUTOMATION_TOKEN || github.token }}

      - name: Resolve tooling checkout
        id: tooling
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          config = Path("translation-config.yml").read_text(encoding="utf-8")
          match = re.search(
              r"(?ms)^tooling:\s*\n(?P<body>(?:^[ \t]+[^\n]*\n?)*)",
              config,
          )
          if not match:
              raise SystemExit("translation-config.yml is missing the tooling section")
          body = match.group("body")

          def field(name: str) -> str:
              item = re.search(rf"(?m)^[ \t]+{name}:\s*(.+?)\s*$", body)
              if not item:
                  raise SystemExit(f"translation-config.yml tooling.{name} is missing")
              return item.group(1).strip().strip("\"'")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"repository={field('repository')}\n")
              handle.write(f"ref={field('ref')}\n")
          PY

      - name: Checkout DSW document-template tooling
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.tooling.outputs.repository }}
          ref: ${{ steps.tooling.outputs.ref }}
          path: tooling-repo

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install tooling dependencies
        working-directory: tooling-repo
        run: make install-dev BOOTSTRAP_PYTHON=python

      - name: Validate translation configuration
        run: |
          set -euo pipefail
          tooling_python="$GITHUB_WORKSPACE/tooling-repo/.venv/bin/python"
          "$tooling_python" "$GITHUB_WORKSPACE/tooling-repo/scripts/ci/validate_translation_config.py" \
            --config translation-config.yml \
            --summary "$GITHUB_STEP_SUMMARY"

  migrate-translations:
    needs: validate-translation-repo
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'translation/v'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout translation repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.TRANSLATION_AUTOMATION_TOKEN || github.token }}

      - name: Resolve tooling checkout
        id: tooling
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          config = Path("translation-config.yml").read_text(encoding="utf-8")
          match = re.search(
              r"(?ms)^tooling:\s*\n(?P<body>(?:^[ \t]+[^\n]*\n?)*)",
              config,
          )
          if not match:
              raise SystemExit("translation-config.yml is missing the tooling section")
          body = match.group("body")

          def field(name: str) -> str:
              item = re.search(rf"(?m)^[ \t]+{name}:\s*(.+?)\s*$", body)
              if not item:
                  raise SystemExit(f"translation-config.yml tooling.{name} is missing")
              return item.group(1).strip().strip("\"'")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"repository={field('repository')}\n")
              handle.write(f"ref={field('ref')}\n")
          PY

      - name: Checkout DSW document-template tooling
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.tooling.outputs.repository }}
          ref: ${{ steps.tooling.outputs.ref }}
          path: tooling-repo

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install tooling dependencies
        working-directory: tooling-repo
        run: make install-dev BOOTSTRAP_PYTHON=python

      - name: Download clean scaffold artifacts from tooling CI
        env:
          GH_TOKEN: ${{ secrets.TOOLING_ARTIFACT_TOKEN || github.token }}
          TOOLING_REPOSITORY: ${{ steps.tooling.outputs.repository }}
        run: |
          set -euo pipefail
          tooling_python="$GITHUB_WORKSPACE/tooling-repo/.venv/bin/python"
          "$tooling_python" "$GITHUB_WORKSPACE/tooling-repo/scripts/ci/download_clean_scaffold_artifacts.py" \
            --repo "$TOOLING_REPOSITORY" \
            --workflow "$TOOLING_WORKFLOW" \
            --output-dir tooling-artifacts

      - name: Sync supported versions and version branches
        id: version-sync
        env:
          GH_TOKEN: ${{ secrets.TRANSLATION_AUTOMATION_TOKEN || github.token }}
          VERSION_POLICY_MODE: ${{ github.event_name == 'workflow_dispatch' && 'manual' || 'auto' }}
        run: |
          set -euo pipefail
          tooling_python="$GITHUB_WORKSPACE/tooling-repo/.venv/bin/python"
          "$tooling_python" "$GITHUB_WORKSPACE/tooling-repo/scripts/ci/sync_translation_version_branches.py" \
            --repo "$GITHUB_WORKSPACE" \
            --tooling-root "$GITHUB_WORKSPACE/tooling-repo" \
            --clean-artifact-root "$GITHUB_WORKSPACE/tooling-artifacts" \
            --github-output "$GITHUB_OUTPUT" \
            --policy-mode "$VERSION_POLICY_MODE" \
            --refresh-existing \
            --push

      - name: Resolve migration source version
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_SOURCE_VERSION: ${{ inputs.source_version }}
          WORKFLOW_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          PREVIOUS_LATEST_VERSION: ${{ steps.version-sync.outputs.previous_latest_version }}
          CURRENT_LATEST_VERSION: ${{ steps.version-sync.outputs.current_latest_version }}
        run: |
          set -euo pipefail
          tooling_python="$GITHUB_WORKSPACE/tooling-repo/.venv/bin/python"
          "$tooling_python" "$GITHUB_WORKSPACE/tooling-repo/scripts/ci/resolve_migration_source.py" \
            --event-name "$EVENT_NAME" \
            --manual-source-version "$MANUAL_SOURCE_VERSION" \
            --workflow-run-head-branch "$WORKFLOW_RUN_HEAD_BRANCH" \
            --previous-latest-version "$PREVIOUS_LATEST_VERSION" \
            --current-latest-version "$CURRENT_LATEST_VERSION" \
            --github-output "$GITHUB_OUTPUT"

      - name: Create or update migration PRs
        if: steps.source.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.TRANSLATION_AUTOMATION_TOKEN || github.token }}
        run: |
          set -euo pipefail
          tooling_python="$GITHUB_WORKSPACE/tooling-repo/.venv/bin/python"
          "$tooling_python" "$GITHUB_WORKSPACE/tooling-repo/scripts/ci/create_translation_migration_prs.py" \
            --repo "$GITHUB_WORKSPACE" \
            --tooling-root "$GITHUB_WORKSPACE/tooling-repo" \
            --source-version "${{ steps.source.outputs.source_version }}" \
            --clean-artifact-root "$GITHUB_WORKSPACE/tooling-artifacts" \
            --push \
            --create-pr
