name: DSW Document Template Translation Operations

on:
  pull_request:
    branches: ["operations"]
  workflow_dispatch:
    inputs:
      validate_only:
        description: "Validate configuration without synchronizing or publishing translations."
        required: false
        default: false
        type: boolean
      source_version:
        description: "Source version to synchronize from, e.g. v1.30.1. Defaults to latest supported version."
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write

env:
  TOOLING_WORKFLOW: headless_render_regression.yml

concurrency:
  # Serialize fan-out from every sync/v* branch so two translated versions
  # cannot update the same target branch concurrently.
  group: dsw-translation-operations
  cancel-in-progress: false

jobs:
  validate-translation-repo:
    runs-on: ubuntu-latest
    outputs:
      tooling_repository: ${{ steps.tooling.outputs.repository }}
      tooling_ref: ${{ steps.tooling.outputs.ref }}
      control_branch: ${{ steps.config.outputs.control_branch }}

    steps:
      - name: Checkout translation repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.TRANSLATION_AUTOMATION_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Resolve tooling checkout
        id: tooling
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          # This minimal parser only locates the tool checkout. The checked-out
          # tool then performs complete schema and duplicate-key validation.
          config = Path("translation-config.yml").read_text(encoding="utf-8")
          match = re.search(
              r"(?ms)^tooling:\s*\n(?P<body>(?:^[ \t]+[^\n]*\n?)*)",
              config,
          )
          if not match:
              raise SystemExit("translation-config.yml is missing the tooling section")
          body = match.group("body")

          def field(name: str) -> str:
              items = re.findall(rf"(?m)^[ \t]+{name}:\s*(.+?)\s*$", body)
              if len(items) != 1:
                  raise SystemExit(
                      f"translation-config.yml tooling.{name} must appear exactly once"
                  )
              value = items[0].strip().strip("\"'")
              if not value:
                  raise SystemExit(
                      f"translation-config.yml tooling.{name} must not be empty"
                  )
              return value

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"repository={field('repository')}\n")
              handle.write(f"ref={field('ref')}\n")
          PY

      - name: Checkout DSW document-template tooling
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.tooling.outputs.repository }}
          ref: ${{ steps.tooling.outputs.ref }}
          path: tooling-repo

      - name: Install tooling dependencies
        working-directory: tooling-repo
        run: make install-dev BOOTSTRAP_PYTHON=python

      - name: Validate translation configuration
        id: config
        run: |
          set -euo pipefail
          tooling_python="$GITHUB_WORKSPACE/tooling-repo/.venv/bin/python"
          "$tooling_python" "$GITHUB_WORKSPACE/tooling-repo/scripts/ci/validate_translation_config.py" \
            --config translation-config.yml \
            --summary "$GITHUB_STEP_SUMMARY"

          "$tooling_python" - <<'PY'
          import os
          from dsw_document_template_tool.translation_repository import load_translation_repository_config

          config = load_translation_repository_config("translation-config.yml")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"control_branch={config.branches.control_branch}\n")
          PY

      - name: Check operations documentation coverage
        run: |
          set -euo pipefail
          tooling_python="$GITHUB_WORKSPACE/tooling-repo/.venv/bin/python"
          "$tooling_python" "$GITHUB_WORKSPACE/tooling-repo/scripts/ci/check_translation_repository_docs.py" \
            --repo "$GITHUB_WORKSPACE"

  sync-translations:
    needs: validate-translation-repo
    if: github.event_name == 'workflow_dispatch' && !inputs.validate_only
    runs-on: ubuntu-latest

    steps:
      - name: Verify operations dispatch branch
        env:
          DISPATCH_BRANCH: ${{ github.ref_name }}
          CONTROL_BRANCH: ${{ needs.validate-translation-repo.outputs.control_branch }}
        run: |
          if [[ "$DISPATCH_BRANCH" != "$CONTROL_BRANCH" ]]; then
            echo "::error::Dispatch synchronization on the configured operations branch: $CONTROL_BRANCH."
            exit 1
          fi
      - name: Checkout translation repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.TRANSLATION_AUTOMATION_TOKEN || github.token }}

      - name: Checkout DSW document-template tooling
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.validate-translation-repo.outputs.tooling_repository }}
          ref: ${{ needs.validate-translation-repo.outputs.tooling_ref }}
          path: tooling-repo

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install tooling dependencies
        working-directory: tooling-repo
        run: make install-dev BOOTSTRAP_PYTHON=python

      - name: Download clean scaffold artifacts from tooling CI
        env:
          GH_TOKEN: ${{ secrets.TOOLING_ARTIFACT_TOKEN || github.token }}
          TOOLING_REPOSITORY: ${{ needs.validate-translation-repo.outputs.tooling_repository }}
        run: |
          set -euo pipefail
          tooling_python="$GITHUB_WORKSPACE/tooling-repo/.venv/bin/python"
          tooling_sha="$(git -C tooling-repo rev-parse HEAD)"
          run_id="$(gh api "repos/$TOOLING_REPOSITORY/actions/workflows/$TOOLING_WORKFLOW/runs?branch=master&head_sha=$tooling_sha&status=success&per_page=100" \
            --jq '[.workflow_runs[] | select(.event == "push" or .event == "schedule" or .event == "workflow_dispatch")][0].id // empty')"
          if [[ -z "$run_id" ]]; then
            echo "::error::No successful trusted tooling run exists for $tooling_sha."
            exit 1
          fi
          "$tooling_python" "$GITHUB_WORKSPACE/tooling-repo/scripts/ci/download_clean_scaffold_artifacts.py" \
            --repo "$TOOLING_REPOSITORY" \
            --run-id "$run_id" \
            --output-dir tooling-artifacts

      - name: Sync supported versions and version branches
        id: version-sync
        env:
          HAS_WORKFLOW_TOKEN: ${{ secrets.TRANSLATION_AUTOMATION_TOKEN != '' }}
          GH_TOKEN: ${{ secrets.TRANSLATION_AUTOMATION_TOKEN || github.token }}
          VERSION_POLICY_MODE: manual
        run: |
          set -euo pipefail
          tooling_python="$GITHUB_WORKSPACE/tooling-repo/.venv/bin/python"
          workflow_args=()
          if [ "$HAS_WORKFLOW_TOKEN" = "true" ]; then
            workflow_args+=(--sync-workflows)
          else
            {
              echo "## Workflow template sync skipped"
              echo
              echo "Version branches were refreshed without modifying files under"
              echo "\`.github/workflows/\` because this run is using the default"
              echo "GitHub Actions token. Configure \`TRANSLATION_AUTOMATION_TOKEN\`"
              echo "with workflow scope and rerun operations when workflow-template"
              echo "changes must be propagated to version branches."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          "$tooling_python" "$GITHUB_WORKSPACE/tooling-repo/scripts/ci/sync_translation_version_branches.py" \
            --repo "$GITHUB_WORKSPACE" \
            --tooling-root "$GITHUB_WORKSPACE/tooling-repo" \
            --clean-artifact-root "$GITHUB_WORKSPACE/tooling-artifacts" \
            --github-output "$GITHUB_OUTPUT" \
            --policy-mode "$VERSION_POLICY_MODE" \
            --refresh-existing \
            "${workflow_args[@]}" \
            --push

      - name: Report cross-version translation consistency
        run: |
          set -euo pipefail
          report_dir="$RUNNER_TEMP/translation-consistency"
          tooling_python="$GITHUB_WORKSPACE/tooling-repo/.venv/bin/python"
          "$tooling_python" \
            "$GITHUB_WORKSPACE/tooling-repo/scripts/ci/report_translation_consistency.py" \
            --repo "$GITHUB_WORKSPACE" \
            --fetch \
            --json-report "$report_dir/report.json" \
            --markdown-report "$report_dir/report.md" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload cross-version translation consistency report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: translation-consistency-report
          retention-days: 7
          path: ${{ runner.temp }}/translation-consistency/
          if-no-files-found: warn

      - name: Resolve synchronization source version
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_SOURCE_VERSION: ${{ inputs.source_version }}
          PREVIOUS_LATEST_VERSION: ${{ steps.version-sync.outputs.previous_latest_version }}
          CURRENT_LATEST_VERSION: ${{ steps.version-sync.outputs.current_latest_version }}
        run: |
          set -euo pipefail
          tooling_python="$GITHUB_WORKSPACE/tooling-repo/.venv/bin/python"
          "$tooling_python" "$GITHUB_WORKSPACE/tooling-repo/scripts/ci/resolve_migration_source.py" \
            --event-name "$EVENT_NAME" \
            --manual-source-version "$MANUAL_SOURCE_VERSION" \
            --previous-latest-version "$PREVIOUS_LATEST_VERSION" \
            --current-latest-version "$CURRENT_LATEST_VERSION" \
            --github-output "$GITHUB_OUTPUT"

      - name: Create or update synchronization PRs
        if: steps.source.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.TRANSLATION_AUTOMATION_TOKEN || github.token }}
          SYNC_POLICY_MODE: ${{ github.event_name == 'workflow_dispatch' && 'manual' || 'auto' }}
        run: |
          set -euo pipefail
          tooling_python="$GITHUB_WORKSPACE/tooling-repo/.venv/bin/python"
          "$tooling_python" "$GITHUB_WORKSPACE/tooling-repo/scripts/ci/create_translation_migration_prs.py" \
            --repo "$GITHUB_WORKSPACE" \
            --tooling-root "$GITHUB_WORKSPACE/tooling-repo" \
            --source-version "${{ steps.source.outputs.source_version }}" \
            --policy-mode "$SYNC_POLICY_MODE" \
            --clean-artifact-root "$GITHUB_WORKSPACE/tooling-artifacts" \
            --push \
            --create-pr
