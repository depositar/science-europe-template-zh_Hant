name: DSW Document Template Translation Sync

on:
  pull_request:
    branches: ["master"]
  schedule:
    # 04:00 Asia/Taipei every day.
    - cron: "0 20 * * *"

permissions:
  contents: write

concurrency:
  group: >-
    document-template-translation-sync-${{ github.event_name == 'pull_request' &&
    github.event.pull_request.head.ref || 'master' }}
  cancel-in-progress: false

env:
  # Pin this to a released branch/tag in production.
  TOOLING_REPOSITORY: ThreeMonth03/DSW-document-template-tool
  TOOLING_REF: master

  # Change only these paths for the host repository.
  COMPACT_TEMPLATE_DIR: workspace/document-templates/compact/dsw-science-europe-1.30.0
  EXPANDED_TEMPLATE_DIR: workspace/document-templates/expanded/dsw-science-europe-1.30.0
  TRANSLATION_TREE_DIR: workspace/document-templates/translation/dsw-science-europe-1.30.0
  TRANSLATED_TEMPLATE_ORGANIZATION_ID: dsw
  TRANSLATED_TEMPLATE_ID: science-europe-zh-hant
  TRANSLATED_TEMPLATE_VERSION: 1.30.0
  TRANSLATED_TEMPLATE_NAME: Science Europe DMP Template (zh-Hant)
  TRANSLATED_TEMPLATE_DIR: outputs/document-templates/translated-expanded/dsw-science-europe-zh-hant-1.30.0
  TRANSLATED_TEMPLATE_PACKAGE: outputs/document-templates/translated-expanded/dsw-science-europe-zh-hant-1.30.0.zip
  PROJECT_REF: workspace/projects/test-project.json
  PROJECT_RENDER_OUTPUT: outputs/project-render/test-project.pdf
  PROJECT_RENDER_FORMAT_UUID: 68c26e34-5e77-4e15-9bf7-06ff92582257

jobs:
  translation-sync:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name == 'schedule' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout template repository
        uses: actions/checkout@v4
        with:
          repository: >-
            ${{ github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name || github.repository }}
          ref: >-
            ${{ github.event_name == 'pull_request' &&
            github.event.pull_request.head.ref || 'master' }}
          path: template-repo
          fetch-depth: 0

      - name: Checkout DSW document-template tooling
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TOOLING_REPOSITORY }}
          ref: ${{ env.TOOLING_REF }}
          path: tooling-repo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tooling dependencies
        working-directory: tooling-repo
        run: make install-dev BOOTSTRAP_PYTHON=python

      # Keep this step when expanded/translation are checked-in generated inputs.
      # If another repository only wants to package already-committed translation
      # edits, it can remove this step and keep only sync/package below.
      - name: Refresh expanded template and translation tree
        run: |
          set -euo pipefail
          HOST_ROOT="$GITHUB_WORKSPACE/template-repo"
          TOOL_ROOT="$GITHUB_WORKSPACE/tooling-repo"

          "$TOOL_ROOT/.venv/bin/python" "$TOOL_ROOT/src/transform_template.py" expand \
            --source "$HOST_ROOT/$COMPACT_TEMPLATE_DIR" \
            --output "$HOST_ROOT/$EXPANDED_TEMPLATE_DIR"

          "$TOOL_ROOT/.venv/bin/python" "$TOOL_ROOT/src/translation_tree.py" export \
            --source "$HOST_ROOT/$EXPANDED_TEMPLATE_DIR" \
            --output "$HOST_ROOT/$TRANSLATION_TREE_DIR"

      - name: Auto-commit repaired translation inputs
        working-directory: template-repo
        env:
          TARGET_REF: >-
            ${{ github.event_name == 'pull_request' &&
            github.event.pull_request.head.ref || 'master' }}
        run: |
          set -euo pipefail
          required_paths=(
            "$EXPANDED_TEMPLATE_DIR"
            "$TRANSLATION_TREE_DIR/.translation-tree"
            "$TRANSLATION_TREE_DIR/tree"
          )

          if [ -z "$(git status --short -- "${required_paths[@]}")" ]; then
            echo "No generated translation input repairs to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$EXPANDED_TEMPLATE_DIR" "$TRANSLATION_TREE_DIR"
          git commit -m "chore(sync): refresh document template translations"
          git push origin "HEAD:$TARGET_REF"

          {
            echo "## Auto-committed translation repairs"
            echo
            echo "The workflow refreshed generated template/translation inputs and pushed"
            echo "the repair commit back to \`$TARGET_REF\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check generated translation inputs are committed
        working-directory: template-repo
        run: |
          set -euo pipefail
          # `outline.md` is a generated progress view. Let CI refresh it without
          # requiring translators to commit checkbox churn before opening a PR.
          git diff --exit-code -- \
            "$EXPANDED_TEMPLATE_DIR" \
            "$TRANSLATION_TREE_DIR/.translation-tree" \
            "$TRANSLATION_TREE_DIR/tree"
          test -z "$(git status --short -- \
            "$EXPANDED_TEMPLATE_DIR" \
            "$TRANSLATION_TREE_DIR/.translation-tree" \
            "$TRANSLATION_TREE_DIR/tree")"

      - name: Sync translations into output template
        run: |
          set -euo pipefail
          HOST_ROOT="$GITHUB_WORKSPACE/template-repo"
          TOOL_ROOT="$GITHUB_WORKSPACE/tooling-repo"
          SYNC_LOG="$(mktemp)"

          if ! "$TOOL_ROOT/.venv/bin/python" "$TOOL_ROOT/src/translation_tree.py" sync \
            --tree "$HOST_ROOT/$TRANSLATION_TREE_DIR" \
            --source "$HOST_ROOT/$EXPANDED_TEMPLATE_DIR" \
            --output "$HOST_ROOT/$TRANSLATED_TEMPLATE_DIR" \
            --template-organization-id "$TRANSLATED_TEMPLATE_ORGANIZATION_ID" \
            --template-id "$TRANSLATED_TEMPLATE_ID" \
            --template-name "$TRANSLATED_TEMPLATE_NAME" \
            --template-version "$TRANSLATED_TEMPLATE_VERSION" 2>&1 | tee "$SYNC_LOG"; then
            {
              echo "## Translation sync failed"
              echo
              echo "The translated template could not be generated. Check the message below;"
              echo "it usually points at the exact translation.md file and placeholder issue."
              echo
              echo '```text'
              tail -n 80 "$SYNC_LOG"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            ERROR_LINE="$(grep -E 'Translation(TreeError| is | uses | introduces )|Missing translation document|Invalid translation document' "$SYNC_LOG" | tail -n 1 || true)"
            if [ -n "$ERROR_LINE" ]; then
              echo "::error title=Translation sync failed::$ERROR_LINE"
            else
              echo "::error title=Translation sync failed::See job summary for details."
            fi
            exit 1
          fi

          "$TOOL_ROOT/.venv/bin/dsw-tdk" package "$HOST_ROOT/$TRANSLATED_TEMPLATE_DIR" \
            --output "$HOST_ROOT/$TRANSLATED_TEMPLATE_PACKAGE" \
            --force

      - name: Audit generated translated output
        run: |
          set -euo pipefail
          HOST_ROOT="$GITHUB_WORKSPACE/template-repo"
          python3 - <<'PY'
          from pathlib import Path
          import os

          host_root = Path(os.environ["GITHUB_WORKSPACE"]) / "template-repo"
          expanded_root = host_root / os.environ["EXPANDED_TEMPLATE_DIR"]
          translated_root = host_root / os.environ["TRANSLATED_TEMPLATE_DIR"]

          def count_href(root: Path) -> int:
              return sum(path.read_text(encoding="utf-8").count("href=") for path in root.rglob("*.j2"))

          expanded_href_count = count_href(expanded_root)
          translated_href_count = count_href(translated_root)
          if expanded_href_count != translated_href_count:
              raise SystemExit(
                  "Translated output lost or gained links: "
                  f"expanded href={expanded_href_count}, translated href={translated_href_count}"
              )

          forbidden_terms = {
              "標識符": "識別碼",
              "持久性標識符": "持續識別碼",
              "數字物件": "數位物件",
              "可重複性": "可重現性",
              "信息": "資訊",
              "主要研究者": "計畫主持人",
              "資料公平": "資料符合 FAIR 原則",
              "項目資料": "專案資料",
              "以下項目": "以下專案",
              "該項目": "該專案",
              "這些項目": "這些專案",
              "所描述的項目": "所描述的專案",
              "創建者": "創作者",
              "未找到": "找不到",
              "購買": "取得",
          }
          forbidden_english = [
              "content: 'Data Management Plan'",
              "This dataset will be collected by an external party",
              "The ownership of the resulting data",
              "The project partners acquire full ownership",
              "For the ownership of the data",
              "We are not using a standardized format",
          ]

          issues: list[str] = []
          generated_source_files = [
              path
              for path in (translated_root / "src").rglob("*")
              if path.suffix in {".css", ".j2"}
          ]
          for path in sorted(generated_source_files):
              text = path.read_text(encoding="utf-8")
              relative = path.relative_to(translated_root).as_posix()
              for bad, expected in forbidden_terms.items():
                  if bad in text:
                      issues.append(f"{relative}: uses {bad!r}; prefer {expected!r}")
              for phrase in forbidden_english:
                  if phrase in text:
                      issues.append(f"{relative}: untranslated source phrase {phrase!r}")

          if issues:
              raise SystemExit("\n".join(issues))
          PY

      # This boots an ephemeral DSW and copies PROJECT_REF into it. PROJECT_REF
      # can either point at an existing project UUID for a persistent DSW, or at
      # a JSON recipe with `knowledge_model_package_id` and `events_file`.
      - name: Start local DSW stack for sample render
        if: ${{ env.PROJECT_REF != '' }}
        working-directory: tooling-repo
        run: make start-ci-dsw

      - name: Render sample project preview
        if: ${{ env.PROJECT_REF != '' }}
        env:
          DSW_API_URL: http://localhost:3000/wizard-api
          DSW_EMAIL: albert.einstein@example.com
          DSW_PASSWORD: password
          DSW_DOWNLOAD_HOST_ALIAS: host.docker.internal=localhost
        run: |
          set -euo pipefail
          HOST_ROOT="$GITHUB_WORKSPACE/template-repo"
          TOOL_ROOT="$GITHUB_WORKSPACE/tooling-repo"

          "$TOOL_ROOT/.venv/bin/python" "$TOOL_ROOT/src/render_project.py" \
            --project-ref "$HOST_ROOT/$PROJECT_REF" \
            --template-dir "$HOST_ROOT/$TRANSLATED_TEMPLATE_DIR" \
            --format-uuid "$PROJECT_RENDER_FORMAT_UUID" \
            --output "$HOST_ROOT/$PROJECT_RENDER_OUTPUT" \
            --tdk-executable "$TOOL_ROOT/.venv/bin/dsw-tdk"

      - name: Annotate sample render metadata
        if: ${{ env.PROJECT_REF != '' }}
        working-directory: template-repo
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os

          root = Path.cwd()
          template_dir = root / os.environ["TRANSLATED_TEMPLATE_DIR"]
          metadata_path = root / f"{os.environ['PROJECT_RENDER_OUTPUT']}.json"

          digest = hashlib.sha256()
          for path in sorted(p for p in template_dir.rglob("*") if p.is_file()):
              relative = path.relative_to(template_dir).as_posix()
              digest.update(relative.encode("utf-8"))
              digest.update(b"\0")
              digest.update(path.read_bytes())
              digest.update(b"\0")

          metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
          metadata["output"] = os.environ["PROJECT_RENDER_OUTPUT"]
          metadata["translated_template_sha256"] = digest.hexdigest()
          metadata_path.write_text(
              json.dumps(metadata, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Collect local DSW logs
        if: ${{ always() && env.PROJECT_REF != '' }}
        working-directory: tooling-repo
        run: make ci-dsw-logs

      - name: Stop local DSW stack
        if: ${{ always() && env.PROJECT_REF != '' }}
        working-directory: tooling-repo
        run: make stop-ci-dsw

      - name: Auto-commit generated outputs
        working-directory: template-repo
        env:
          TARGET_REF: >-
            ${{ github.event_name == 'pull_request' &&
            github.event.pull_request.head.ref || 'master' }}
        run: |
          set -euo pipefail
          content_paths=("$TRANSLATED_TEMPLATE_DIR")
          output_paths=("$TRANSLATED_TEMPLATE_DIR" "$TRANSLATED_TEMPLATE_PACKAGE")
          render_paths=()
          if [ -n "$PROJECT_RENDER_OUTPUT" ]; then
            render_paths=("$PROJECT_RENDER_OUTPUT" "$PROJECT_RENDER_OUTPUT.json")
            output_paths+=("${render_paths[@]}")
          fi

          # `dsw-tdk package` embeds UUID/timestamp metadata in the zip. Avoid
          # committing zip/PDF-only churn when the translated template directory
          # did not actually change. Keep those fresh files in the workspace so
          # the artifact upload still contains the latest package/render preview.
          committed_render_is_current() {
            if [ -z "$PROJECT_RENDER_OUTPUT" ]; then
              return 0
            fi

            EXPECTED_SOURCE_TEMPLATE_ID="${TRANSLATED_TEMPLATE_ORGANIZATION_ID}:${TRANSLATED_TEMPLATE_ID}:${TRANSLATED_TEMPLATE_VERSION}" \
            EXPECTED_STAGED_TEMPLATE_ID="${TRANSLATED_TEMPLATE_ORGANIZATION_ID}:${TRANSLATED_TEMPLATE_ID}-project-render:${TRANSLATED_TEMPLATE_VERSION}" \
            TRANSLATED_TEMPLATE_DIR="$TRANSLATED_TEMPLATE_DIR" \
            PROJECT_RENDER_OUTPUT="$PROJECT_RENDER_OUTPUT" python3 - <<'PY'
          import json
          import hashlib
          import os
          from pathlib import Path
          import subprocess
          import sys

          render_output = os.environ["PROJECT_RENDER_OUTPUT"]
          template_dir = Path(os.environ["TRANSLATED_TEMPLATE_DIR"])
          expected_source = os.environ["EXPECTED_SOURCE_TEMPLATE_ID"]
          expected_staged = os.environ["EXPECTED_STAGED_TEMPLATE_ID"]

          digest = hashlib.sha256()
          for path in sorted(p for p in template_dir.rglob("*") if p.is_file()):
              relative = path.relative_to(template_dir).as_posix()
              digest.update(relative.encode("utf-8"))
              digest.update(b"\0")
              digest.update(path.read_bytes())
              digest.update(b"\0")
          expected_template_hash = digest.hexdigest()

          result = subprocess.run(
              ["git", "show", f"HEAD:{render_output}.json"],
              check=False,
              stdout=subprocess.PIPE,
              stderr=subprocess.DEVNULL,
              text=True,
          )
          if result.returncode != 0:
              sys.exit(1)

          try:
              metadata = json.loads(result.stdout)
          except json.JSONDecodeError:
              sys.exit(1)

          if metadata.get("source_template_id") != expected_source:
              sys.exit(1)
          if metadata.get("staged_template_id") != expected_staged:
              sys.exit(1)
          if metadata.get("translated_template_sha256") != expected_template_hash:
              sys.exit(1)

          pdf_exists = subprocess.run(
              ["git", "cat-file", "-e", f"HEAD:{render_output}"],
              check=False,
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL,
          )
          sys.exit(0 if pdf_exists.returncode == 0 else 1)
          PY
          }

          if [ -z "$(git status --short -- "${content_paths[@]}")" ]; then
            if [ "${#render_paths[@]}" -gt 0 ] && ! committed_render_is_current; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add "${render_paths[@]}"
              git commit -m "chore(sync): refresh sample project render"
              git push origin "HEAD:$TARGET_REF"

              {
                echo "## Auto-committed sample project render"
                echo
                echo "The translated template content was already committed, but the"
                echo "checked-in demo project render was stale and has been refreshed."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            echo "No translated template content changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${output_paths[@]}"
          git commit -m "chore(sync): refresh generated document outputs"
          git push origin "HEAD:$TARGET_REF"

          {
            echo "## Auto-committed generated outputs"
            echo
            echo "The workflow refreshed the translated document template and demo"
            echo "project render, then pushed the output commit back to \`$TARGET_REF\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload translated template package
        uses: actions/upload-artifact@v4
        with:
          name: translated-document-template
          path: |
            template-repo/${{ env.TRANSLATED_TEMPLATE_DIR }}
            template-repo/${{ env.TRANSLATED_TEMPLATE_PACKAGE }}
            template-repo/${{ env.PROJECT_RENDER_OUTPUT }}
            template-repo/${{ env.PROJECT_RENDER_OUTPUT }}.json
            tooling-repo/outputs/ci-dsw/

  skip-fork-pr:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Explain fork PR skip policy
        run: echo "Skipping auto-sync commit for fork pull requests."
