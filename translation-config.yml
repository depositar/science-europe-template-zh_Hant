schema_version: 1

template:
  organization_id: dsw
  template_id: science-europe
  upstream_repository: https://github.com/ds-wizard/science-europe-template.git
  supported_ref_spec: v1.29.1+
  supported_versions:
    - v1.29.1
    - v1.30.0
    - v1.30.1

version_policy:
  defaults:
    state: available
    refresh: false
    migrate_into: false
    publish_release: false
    reason: scaffold available; translation not started
  rules: []
  overrides:
    v1.29.1:
      state: active
      refresh: auto
      migrate_into: auto
      publish_release: true
      reason: actively translated
    v1.30.0:
      state: active
      refresh: auto
      migrate_into: auto
      publish_release: true
      reason: actively translated
    v1.30.1:
      state: active
      refresh: auto
      migrate_into: auto
      publish_release: true
      reason: actively translated

translation:
  source_language: en
  target_language: zh_Hant
  target_language_label: zh-Hant
  translated_template_organization_id: dsw
  translated_template_id: science-europe-zh-hant
  translated_template_name: Science Europe DMP Template (zh-Hant)

branches:
  control_branch: master
  version_branch_prefix: translation/
  archive_branch: archive/master-before-version-branches-20260622-135746

public_readme:
  path: workspace/document-templates/public-readme/README.md

tooling:
  repository: ThreeMonth03/DSW-document-template-tool
  ref: master

migration:
  mode: exact-only
  non_exact_policy: leave_empty_needs_translation
  auto_pr_enabled: true
  auto_pr_branch_prefix: automation/migrate
  auto_merge_when_clean: true

publish:
  enabled: false
  target_repository: depositar/science-europe-template-zh_Hant
  branch_prefix: sync/
